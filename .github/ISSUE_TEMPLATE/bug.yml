name: Bug report
description: Report broken or regressed plugin behavior
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove tokens, private conversation content, usernames, and sensitive paths before submitting.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: 0.1.1
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DeepSeek Harness version
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Profile
      options: [Web, Desktop]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: List the smallest reliable sequence from startup to failure.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
      description: Do not include secrets or private Session content.
