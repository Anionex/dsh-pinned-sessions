name: Feature request
description: Propose a focused Session pinning workflow improvement
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Workflow problem
      description: Describe the repeated task or friction you need to remove.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain where the control belongs and what should happen.
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Affected profile
      options: [Web, Desktop, Both]
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
